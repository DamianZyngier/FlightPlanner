<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Planner Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script data-noptimize="1" data-cfasync="false" data-wpfc-render="false">
      (function () {
          var script = document.createElement("script");
          script.async = 1;
          script.src = 'https://emrld.cc/NTA1OTc1.js?t=505975';
          document.head.appendChild(script);
      })();
    </script>
</head>
<body>

<div class="app-layout">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <span class="icon">✈️</span>
            <h1>Flight Planner</h1>
        </div>
        
        <!-- Section 1: Filters -->
        <div class="sidebar-section">
            <label class="section-label">Active Filters</label>
            <div class="range-container">
                <p class="help-text">Max Distance from KRK</p>
                <div class="range-row">
                    <input type="range" id="origin-dist" min="0" max="1000" step="50" value="600">
                    <span class="range-val"><span id="val-dist-krk">600</span>km</span>
                </div>
                <div id="included-origins" class="origin-list"></div>
            </div>

            <div class="range-container" style="margin-top: 1rem;">
                <p class="help-text">Max Trip Duration</p>
                <div class="range-row">
                    <input type="range" id="filter-duration" min="1" max="30" step="1" value="30">
                    <span class="range-val"><span id="val-duration">30</span>d</span>
                </div>
            </div>
        </div>

        <!-- Section 2: Importance Weights -->
        <div class="sidebar-section">
            <label class="section-label">What's Important? (Weights)</label>
            <div class="range-container">
                <p class="help-text">Low Price Importance</p>
                <div class="range-row">
                    <input type="range" id="w-price" min="0" max="2" step="0.1" value="1.0">
                    <span class="range-val" id="val-w-price">1.0</span>
                </div>
            </div>
            <div class="range-container">
                <p class="help-text">Origin Distance Importance</p>
                <div class="range-row">
                    <input type="range" id="w-dist" min="0" max="2" step="0.1" value="0.5">
                    <span class="range-val" id="val-w-dist">0.5</span>
                </div>
            </div>
            <div class="range-container">
                <p class="help-text">Best Weather Importance</p>
                <div class="range-row">
                    <input type="range" id="w-weather" min="0" max="2" step="0.1" value="0.5">
                    <span class="range-val" id="val-w-weather">0.5</span>
                </div>
            </div>
        </div>

        <!-- Section 3: Manage Destinations -->
        <div class="sidebar-section">
            <label class="section-label">Tracked Destinations</label>
            <div class="smart-input">
                <input type="text" id="dest-autocomplete" list="dest-suggestions" placeholder="Add country or city...">
                <datalist id="dest-suggestions"></datalist>
                <button id="add-dest-btn" class="btn-primary-sm">Add</button>
            </div>
            <div id="dest-list"></div>
        </div>

        <div class="sidebar-footer">
            <button id="scan-btn" class="btn-primary" style="margin-bottom: 1rem; width: 100%;">🚀 Run Global Scan</button>
            <div id="last-updated">Updating...</div>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-nav">
            <div class="metric">
                <span class="metric-label">Best Match</span>
                <span id="stat-best-price" class="metric-value">--</span>
            </div>
            <div class="metric">
                <span class="metric-label">Active Routes</span>
                <span id="stat-total-routes" class="metric-value">--</span>
            </div>
            <div class="metric">
                <span class="metric-label">Precision Engine</span>
                <span class="metric-value" id="precision-status" style="color: var(--warning)">Standby</span>
            </div>
        </header>

        <div class="view-container">
            <section class="section-deals">
                <div class="section-header">
                    <h2>Live Opportunities</h2>
                </div>
                <div id="deals-grid" class="deals-grid"></div>
            </section>

            <section class="section-analytics">
                <h2>Price Trends</h2>
                <div class="chart-wrapper">
                    <canvas id="historyChart"></canvas>
                </div>
            </section>
        </div>
    </main>
</div>

<script src="app.js"></script>
</body>
</html>
