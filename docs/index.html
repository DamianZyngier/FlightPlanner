<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Planner Pro</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script data-noptimize="1" data-cfasync="false" data-wpfc-render="false">
      (function () {
          var script = document.createElement("script");
          script.async = 1;
          script.src = 'https://emrld.cc/NTA1OTc1.js?t=505975';
          document.head.appendChild(script);
      })();
    </script>
</head>
<body>

<div class="app-layout">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <span class="icon">✈️</span>
            <h1>Flight Planner</h1>
        </div>
        
        <div class="sidebar-section">
            <label class="section-label">Scanning Control</label>
            <button id="scan-btn" class="btn-primary">🚀 Run Global Scan</button>
            <div id="scan-status" class="status-text">Ready</div>
        </div>

        <div class="sidebar-section">
            <label class="section-label">Origin Distance</label>
            <div class="range-container">
                <input type="range" id="origin-dist" min="0" max="1000" step="50" value="600">
                <span class="range-val"><span id="val-dist-krk">600</span>km</span>
            </div>
            <p class="help-text">Max distance from Kraków</p>
        </div>

        <div class="sidebar-section">
            <label class="section-label">Manage Destinations</label>
            <div class="input-group">
                <input type="text" id="new-dest-country" placeholder="Country" maxlength="2">
                <input type="text" id="new-dest-code" placeholder="IATA" maxlength="3">
                <button id="add-dest-btn" class="btn-icon">+</button>
            </div>
            <div id="dest-list" class="tag-cloud"></div>
        </div>

        <div class="sidebar-footer">
            <div id="last-updated">Updating...</div>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-nav">
            <div class="metric">
                <span class="metric-label">Best Deal</span>
                <span id="stat-best-price" class="metric-value">--</span>
            </div>
            <div class="metric">
                <span class="metric-label">Active Routes</span>
                <span id="stat-total-routes" class="metric-value">--</span>
            </div>
            <div class="metric">
                <span class="metric-label">Source</span>
                <span class="metric-value">Travelpayouts</span>
            </div>
        </header>

        <div class="view-container">
            <section class="section-deals">
                <div class="section-header">
                    <h2>Current Opportunities</h2>
                    <div class="sort-controls">
                        <!-- Add sorting if needed later -->
                    </div>
                </div>
                <div id="deals-grid" class="deals-grid">
                    <!-- Cards injected here -->
                </div>
            </section>

            <section class="section-analytics">
                <h2>Price Trends</h2>
                <div class="chart-wrapper">
                    <canvas id="historyChart"></canvas>
                </div>
            </section>
        </div>
    </main>
</div>

<script src="app.js"></script>
</body>
</html>
